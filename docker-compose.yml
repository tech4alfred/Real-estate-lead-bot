version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: relb-postgres
    environment:
      POSTGRES_USER: relb
      POSTGRES_PASSWORD: relb_dev_password
      POSTGRES_DB: real_estate_leads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relb -d real_estate_leads"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relb-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://relb:relb_dev_password@postgres:5432/real_estate_leads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  n8n:
    image: n8nio/n8n:latest
    container_name: relb-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=change_me
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows

  # Frontend can be run with `npm run dev` outside Docker during early development.
  # Uncomment and configure when ready for containerized frontend.
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

volumes:
  postgres_data:
  n8n_data:
